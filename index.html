<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Offline Arcade</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- HUB -->
  <main id="hub" class="screen active">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="40" height="40">
        <div>
          <span class="brand-small">OFFLINE</span>
          <span class="brand-big">ARCADE</span>
        </div>
      </div>
      <span id="net" class="net" aria-live="polite"></span>
    </header>

    <section class="hero">
      <div class="hero-art" aria-hidden="true"></div>
      <div class="hero-copy">
        <span class="eyebrow">Party mode</span>
        <h1>Pass the phone.<br>Settle the score.</h1>
        <button class="btn primary" data-open="xo">Play XO</button>
      </div>
    </section>

    <nav class="filters" aria-label="Filter games">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="2p">2 Player</button>
      <button class="chip" data-filter="solo">Solo</button>
      <button class="chip" data-filter="board">Board</button>
      <button class="chip" data-filter="puzzle">Puzzle</button>
    </nav>

    <p id="count" class="count"></p>
    <section id="grid" class="grid" aria-label="Games"></section>

    <div class="ad-slot" data-ad="banner"></div>
  </main>

  <!-- GAME -->
  <section id="game" class="screen" aria-live="polite">
    <header class="game-bar">
      <button class="icon-btn" id="back" aria-label="Back to games">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="game-title"></h2>
      <span></span>
    </header>
    <div id="stage" class="stage"></div>
  </section>

  <!-- INTERSTITIAL AD -->
  <div id="interstitial" class="interstitial" hidden>
    <div class="ad-full">
      <span class="ad-tag">AD</span>
      <p>Your ad here</p>
      <button class="btn" id="close-ad">Continue</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
